<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Chirag 💙</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div id="bootScreen">

    <div class="bootLogo">
        <h1>BirthdayOS</h1>
        <p>Version 19.0</p>
    </div>

    <div class="loadingBar">
        <div id="loadingFill"></div>
    </div>

    <div id="bootStatus">
        Initializing...
    </div>

</div>

<div id="background"></div>

<div class="terminal">

    <div class="topbar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>

        <h3>BirthdayOS.exe</h3>
    </div>

    <pre id="terminalText"></pre>

</div>

<div id="birthdayCard">

    <h1>🎉 Happy Birthday Chirag 🎉</h1>

    <h2>Version 19.0 Installed Successfully</h2>

    <div class="cake">🎂</div>

    <p>
        Another year older.<br>
        Another year wiser.<br>
        Still no bugs detected. 😎
    </p>

    <h3>From Bhumika 💙</h3>

    <button id="replay">
        Replay
    </button>

</div>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>

</body>

</html>
